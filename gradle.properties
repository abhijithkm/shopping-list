# Project-wide Gradle settings. Secrets (release signing) never go here: see README "Release signing".
# Build requires JDK 17+ in JAVA_HOME (the `java` on PATH may be older).
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
